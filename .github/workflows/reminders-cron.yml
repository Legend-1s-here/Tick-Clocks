name: Send Scheduled Habit & Task Reminders

on:
  schedule:
    # Runs every 15 minutes, 24/7
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Reminders Endpoint
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://tick-clocks.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is missing! Please add CRON_SECRET in GitHub repo Settings > Secrets and variables > Actions."
            exit 1
          fi

          BASE_URL="${APP_URL%/}"
          TARGET_URL="${BASE_URL}/api/cron/reminders"
          echo "Triggering $TARGET_URL ..."

          RESPONSE=$(curl -s -S -w "\nHTTP_STATUS:%{http_code}" -X POST "$TARGET_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Response Body:"
          echo "$HTTP_BODY"
          echo "HTTP Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: Cron endpoint returned status $HTTP_STATUS"
            exit 1
          fi
