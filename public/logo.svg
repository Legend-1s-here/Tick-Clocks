<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Main Vibrant Brand Orange -->
    <linearGradient id="brandOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>

    <!-- Top Lid Highlight -->
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA07A"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>

    <!-- Emerald Arrow Gradient -->
    <linearGradient id="greenArrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF6B35" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- Interlocking Hexagonal Box / Infinite Loop Symbol (Sleek Modern Mark) -->

    <!-- Outer Frame Top Face -->
    <polygon points="256,90 376,160 256,230 136,160" fill="url(#lidGrad)"/>

    <!-- Left Box Face -->
    <polygon points="136,160 256,230 256,370 136,300" fill="url(#brandOrange)"/>

    <!-- Right Box Face (Darker Tone for Depth) -->
    <polygon points="256,230 376,160 376,300 256,370" fill="#C2410C"/>

    <!-- Cutout Ribbon / Circular Flow Arrow Wrap around Box -->
    <!-- Curved Arrow Arc wrapping around the isometric box -->
    <path d="M 100 270 C 80 180, 160 100, 256 100 C 360 100, 440 180, 420 280 C 404 360, 310 420, 256 420" 
          fill="none" 
          stroke="url(#greenArrow)" 
          stroke-width="26" 
          stroke-linecap="round"
          filter="url(#glow)"/>

    <!-- Circular Arrow Head -->
    <polygon points="256,440 286,400 230,405" fill="url(#greenArrow)"/>

    <!-- Inner Core Icon: Stylized "D" and "S" negative space lines -->
    <!-- Tape/Seam Line on Box Top -->
    <line x1="256" y1="90" x2="256" y2="230" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="6" stroke-dasharray="12 8"/>

    <!-- Front Seam Line -->
    <line x1="256" y1="230" x2="256" y2="370" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4"/>
  </g>

  <!-- Typography -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="3">
    <tspan fill="#FFFFFF">DEAD</tspan><tspan fill="#FF6B35">STOCK</tspan>
  </text>
</svg>
